acceptance_criteria:
  AC1:
    result: PASS
    evidence: "Elegibilidade aceita nota_fiscal com application/pdf e currentVersionId; XML e tipos não elegíveis permanecem cobertos pelo serviço."
    limitation: "O teste do CTA usa elegibilidade mockada e não há E2E autenticado."
  AC2:
    result: PASS
    evidence: "pdf.js é importado dinamicamente, worker usa new URL(..., import.meta.url), download local e body do handler contém somente document_version_id/extracted_text."
    limitation: "A Edge Function publicada não foi exercitada."
  AC3:
    result: CONCERNS
    evidence: "Build mantém chunks PDF fora do first-load e a UI possui status aria-live durante a leitura. operationRef bloqueia concorrência."
    limitation: "Não há teste específico de viewport/conexão móvel nem asserção de duplo envio; a referência de aproximadamente 505 KB gzip não foi tratada como constante."
  AC4:
    result: PASS
    evidence: "Handler autentica, resolve versão sob a sessão, usa companyId do documento autorizado, retorna 404 na fronteira cross-tenant e rejeita body com campos extras antes da autenticação."
    limitation: "Sem sessão/RLS E2E contra banco não produtivo."
  AC5:
    result: PASS
    evidence: "Extrator percorre todas as páginas, faz trim de item.str, conta caracteres não-espaço, retorna mensagem literal de escaneado e oferece Salvar só o arquivo; testes de UI/serviço passam."
    limitation: "Sem fixture PDF binária real e sem validação manual em browser autenticado."
  AC6:
    result: FAIL
    evidence: "O caso obrigatório de múltiplas candidatas falha: duas ocorrências da mesma chave válida são deduplicadas pelo Set e não viram pdf_access_key_ambiguous."
    limitation: "A mutação do handler já foi comprovada no brief e não foi repetida."
  AC7:
    result: PASS
    evidence: "O teste focado do handler confirma chave validada, proposta pending, text_origin=client, field origins/fontes e payload de cabeçalho; rotas XML/boleto ficaram intactas."
    limitation: "O teste dedicado do adapter não entra no npm test padrão."
  AC8:
    result: PASS
    evidence: "Adapter e handler produzem items = []; createProposal não insere itens quando a lista está vazia; revisão, resumo e sucesso PDF não prometem produtos/estoque."
    limitation: "Não houve confirmação positiva no banco."
  AC9:
    result: PASS
    evidence: "Aviso exato de origem client aparece no topo antes dos campos, com aria-live/role alert e trechos por campo; não aparece no caminho XML testado."
    limitation: "A validação visual manual de temas e leitor de tela não foi possível nesta sessão."
  AC10:
    result: PASS
    evidence: "Hook e componente cobrem revisão, resumo, confirming, success, falhas, retry, validação financeira e preservação do arquivo por ação de fechamento."
    limitation: "Aplicação/RPC e atomicidade permanecem sem E2E de banco."
  AC11:
    result: FAIL
    evidence: "Falha de leitura por chave ambígua não satisfaz o requisito de erro explícito antes de criar proposta; o teste correspondente falha quando executado isoladamente."
  AC12:
