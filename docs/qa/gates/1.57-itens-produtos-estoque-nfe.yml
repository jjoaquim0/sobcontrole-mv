    evidence: "Casos separados cobrem exatamente 20 e 21 decisões, 60 e 61 itens; 60 permanece no fluxo normal, 61 mostra aviso de volume, o sub-aviso acima de 20 é não bloqueante e o cabeçalho continua confirmável."
    limitation: "Não houve E2E visual acima do corte; a prova disponível é componente/modal e revisão estática."
  AC7:
    result: CONCERNS
    evidence: "UI salva a proposta e chama somente apply_nfe_purchase_proposal; a RPC remota bloqueia a proposta com FOR UPDATE, valida tenant e agora rejeita matched_product_id cross-tenant antes de qualquer INSERT em purchase_items."
