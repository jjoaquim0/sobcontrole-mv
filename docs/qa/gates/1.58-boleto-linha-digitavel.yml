acceptance_criteria:
  AC1:
    result: PASS
    evidence: >-
      Parser e handler rejeitam vazio/tamanho incorreto antes de job/proposta; normalização canônica não
      corrige heurísticamente e não chama IA/quota. Execução local real do código do commit.
    limitation: "A versão executada localmente ainda não está publicada na Edge Function."
  AC2:
    result: PASS
    evidence: >-
      Testes isolam cada DV de módulo 10 e confirmam ausência de job/proposta no handler para linha inválida.
      Execução local real do parser e da fronteira do handler.
    limitation: "Não houve chamada da Edge Function publicada."
  AC3:
    result: PASS
    evidence: >-
      Barcodes das duas fixtures, restos 0/1/10 do módulo 11 e DV geral incompatível estão assertados;
      DV geral inválido não avança ao caminho de proposta.
    limitation: "A ausência de proposta foi verificada na fronteira mockada do handler; não houve E2E de banco."
  AC4:
    result: PASS
    evidence: >-
      Fixtures independentes têm valor, fator, ambas as datas candidatas e data selecionada assertados
      exatamente, cobrindo R8: 2024-12-10 e 2025-03-15.
    limitation: "Prova local do parser; a rota que o usuário acionaria ainda não está publicada."
  AC5:
    result: CONCERNS
    evidence: >-
      Documento sintético, source, job, proposta, payload/origens e text_origin estão implementados e
      cobertos por contratos locais do serviço/handler.
    limitation: >-
      Não há prova de inserção/estado no PostgreSQL; a Edge Function que executaria o caminho não está
      publicada.
  AC6:
    result: PASS
    evidence: >-
      Componente mostra linha, valor/data display-only, selo, descrição acessível, fornecedor, foco/Escape
      e estados de revisão; testes de serviço, hook e componente passam.
    limitation: "Não houve inspeção manual de browser, contraste ou renderização de tema."
  AC7:
    result: PASS
    evidence: >-
      Autosave atualiza somente fornecedor dentro de payload pendente; consultas têm tenant/categoria;
      pending retoma, applied bloqueia e rejected foi exercitado como nova tentativa, sem bypass.
    limitation: "A prova disponível é local por serviço/hook/componente; não há cenário PostgreSQL E2E."
  AC8:
    result: CONCERNS
    evidence: >-
      Cliente chama somente apply_boleto_payable_proposal para proposta pendente; D16 remota foi verificada
      por leitura (SECURITY INVOKER/prosecdef=false) e recalcula valor/data a partir de idempotency_key,
      rejeitando divergências.
    limitation: "Não houve aplicação positiva no banco e a Edge Function não está publicada."
  AC9:
    result: CONCERNS
    evidence: >-
      Tratamento local cobre falha segura, applied sem retry e colisão 23505 sem bypass.
    limitation: >-
      Não há E2E PostgreSQL para concorrência, atomicidade, conta a pagar, rejeição real ou contagens
      antes/depois; a funcionalidade não está disponível na versão publicada.
  AC10:
    result: CONCERNS
    evidence: >-
      Handler deriva empresa do documento autorizado e a RPC exige sessão/empresa e compara a proposta
      com get_user_company_id; cliente não envia company_id nem supplierId como autoridade.
    limitation: "Não houve sessão/RLS real A/B nem aplicação E2E."
  AC11:
    result: PASS
    evidence: >-
      npm test e build passam; regressão NF-e e AiSiteIntegrationAction passaram. A alteração do handler
      compartilhado foi auditada sem alteração incidental observada.

resolved_issues: []

top_issues:
  - id: "TEST-001"
    severity: medium
    status: open
    finding: >-
      Continua sem ambiente PostgreSQL descartável autorizado; AC5/AC8/AC9/AC10 não têm prova E2E de
      persistência, aplicação positiva, concorrência, atomicidade, rollback, contagens e isolamento A/B.
    suggested_action: "Em rodada futura autorizada, usar ambiente não produtivo e executar a matriz sem escrever na produção."
  - id: "OPS-001"
    severity: medium
    status: deployment_pending
    finding: >-
      O código desta story não está na Edge Function em produção: document-extraction permanece na versão
      2, então a rota não está disponível para o usuário.
    suggested_action: "Solicitar autorização explícita e encaminhar publicação ao @devops; depois revalidar o runtime."
  - id: "REL-001"
    severity: medium
    status: open
    finding: "A persistência compartilhada de proposta e itens continua em chamadas separadas com compensação; o risco de compensação permanece aberto."
    suggested_action: "Avaliar persistência transacional em rodada futura; não redesenhar nem alterar o escopo deste gate."
  - id: "TEST-003"
    severity: low
    status: open
    finding: "Cobertura anterior de categoria em lote, margem, expiração/reload completo e corrida entre autosaves permanece aberta."
    suggested_action: "Adicionar testes de interação/concorrência em manutenção futura."
  - id: "DATA-002"
    severity: low
    status: open
    finding: "NfeProposalItemPatch ainda expõe currentCost, embora saveNfeProposalItem o ignore deliberadamente."
    suggested_action: "Remover ou separar o campo do tipo em manutenção futura."
  - id: "DOC-002"
    severity: low
    status: open
    finding: "O cabeçalho da migration D18 ainda referencia 20260826180000; o arquivo reconciliado é 20260827020502."
    suggested_action: "Encaminhar correção documental à @data-engineer; não editar migration/rollback neste gate."

