acceptance_criteria:
  AC1:
    result: CONCERNS
    evidence: "O contrato exclui rejected; não houve segunda inserção real após uma proposta rejeitada."
    limitation: "Sem E2E PostgreSQL, não é possível afirmar que a chave é aceita pelo índice em runtime."
  AC2:
    result: CONCERNS
    evidence: "O contrato exclui expired; não houve segunda inserção real após uma proposta expirada."
    limitation: "Sem E2E PostgreSQL, não é possível afirmar que a chave é aceita pelo índice em runtime."
  AC3:
    result: CONCERNS
    evidence: "O contrato exige pending e applied; mutações que removem applied ou incluem rejected falham, e a chave composta é verificada."
    limitation: "Não houve tentativa real de segunda proposta/aplicação bloqueada pelo índice."
  AC4:
    result: CONCERNS
    evidence: "O índice mantém company_id na chave e o teste do handler propaga a empresa autorizada com a mesma chave."
    limitation: "Não houve exercício de isolamento, bloqueio ou ausência de leitura cruzada entre empresas no banco."
  AC5:
    result: CONCERNS
    evidence: "O tratamento de 23505 continua mapeando para duplicate_nfe, falha o job e mantém a mensagem sem bypass ou chave alternativa."
    limitation: "Não houve colisão real originada pelo banco nem reimportação após rejected/expired; somente NF-e tem fluxo implementado."
  AC6:
    result: CONCERNS
    evidence: "Migration e rollback pareados passam no contrato estático; o rollback documenta o risco de 23505 quando propostas mortas duplicadas já existem e exige consulta prévia."
    limitation: "Rollback não foi executado; a migration ainda contém referência comentada obsoleta a 20260826180000, embora os arquivos e a versão registrada sejam 20260827020502."

