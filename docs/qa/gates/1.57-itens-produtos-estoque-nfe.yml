    evidence: "Pré-condições foram satisfeitas: D10 está registrada como 20260825140000; a função remota preserva exatamente um UPDATE de current_quantity = current_quantity + v_item_quantity fora do ELSIF de custo e SEC-001 está aplicado como 20260826230250."
    limitation: "Por decisão do usuário, não houve proposta de teste; incremento positivo existente/novo, uma atualização por item, concorrência e rollback permanecem sem prova E2E."
  AC9:
