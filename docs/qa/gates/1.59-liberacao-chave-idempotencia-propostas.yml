schema: 1
story: "1.59"
gate: CONCERNS
status_reason: >-
  A migration D18 e o rollback pareado estão estruturalmente coerentes, o índice parcial real foi
  confirmado por leitura em produção, os testes locais passam e não há regressão atribuível aos
  arquivos tocados. O gate permanece CONCERNS, e não PASS, porque os ACs 1–4 afirmam efeitos de
  inserção/conflito no PostgreSQL e a infraestrutura local não possui Postgres executável; produção
  tem dados reais e não pode receber escrita. O contrato textual é falsificável, mas não é E2E. O
  boleto ainda não existe e permanece dependente da Story 1.58. CONCERNS é aprovável conforme o ciclo
  de vida; por isso a story foi regularizada de InProgress para Done. O handoff intermediário
  InProgress → InReview não foi registrado pelo @dev e não é tratado como se tivesse ocorrido.
reviewer: "Quinn"
updated: "2026-08-27"
transition: "InProgress -> Done"

user_decisions:
  - "2026-08-26: o usuário recusou criar ambiente Supabase descartável nesta rodada por custo; essa recusa não é permanente."
  - "2026-08-27: o usuário determinou que o gate permanecesse sob decisão independente de QA; o veredito CONCERNS foi mantido sem pressão para PASS."
  - "2026-08-27: produção deve ser somente-leitura para este gate; nenhuma migration, deploy, DDL/DML, cenário de teste, push, PR ou CodeRabbit foi autorizado."

