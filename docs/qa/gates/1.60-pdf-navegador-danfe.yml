resolved_issues: []

top_issues:
  - id: "REQ-001"
    severity: high
    status: open
    finding: "O adapter trata duas ocorrências da mesma chave de acesso válida como uma única candidata, aceitando o fluxo em vez de rejeitar ambiguidade; o teste obrigatório falha."
    suggested_action: "Preservar a contagem/posição das ocorrências válidas e rejeitar qualquer PDF com mais de uma ocorrência, inclusive quando os valores forem idênticos; adicionar o teste ao conjunto executado pelo npm test."
  - id: "TEST-001"
    severity: medium
    status: open
    finding: "danfe.test.ts está fora do include do Vitest (vite.config.ts inclui apenas src/**/*.{test,spec}.{ts,tsx}), ocultando a falha do adapter na suíte de 642 testes."
    suggested_action: "Incluir os testes da Edge Function na configuração de teste ou criar um comando de gate que sempre os execute."
  - id: "TEST-002"
    severity: medium
    status: open
    finding: "AC3 não tem prova específica de viewport/conexão móvel e submissão duplicada; a implementação tem indicador aria-live e guarda de operação, mas não há asserções dedicadas."
    suggested_action: "Adicionar testes de componente/hook para conexão móvel simulada, primeiro carregamento, indicador e duas chamadas concorrentes."
  - id: "TEST-003"
    severity: medium
    status: dependency_open
    finding: "Não há E2E de banco nem execução da Edge Function publicada; a taxa de acerto em DANFEs reais permanece desconhecida conforme o brief."
    suggested_action: "Após autorização, publicar via @devops e validar com ambiente não produtivo e 10–20 DANFEs reais de emissores diferentes."
  - id: "OPS-001"
    severity: low
    status: documented_condition
    finding: "document-extraction não foi publicada com o código desta story."
    suggested_action: "Solicitar autorização operacional e encaminhar o deploy exclusivamente ao @devops; revalidar o runtime depois."

