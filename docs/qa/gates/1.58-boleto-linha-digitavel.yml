schema: 1
story: "1.58"
gate: CONCERNS
status_reason: >-
  A implementação do boleto por linha digitável passa na prova local determinística, nas Fixtures A/B
  de R8, nos estados da UI e na regressão do caminho NF-e. O gate permanece CONCERNS, e não PASS,
  porque AC5/AC8/AC9/AC10 dependem de efeitos de persistência, RPC, idempotência e tenant no PostgreSQL
  sem prova E2E autorizada. Além disso, a Edge Function document-extraction não foi publicada: a produção
  permanece na versão 2, portanto a funcionalidade ainda não está disponível para o usuário. Isso não é
  FAIL atribuível ao @dev, pois deploy está fora do escopo desta preparação e exige autorização explícita
  do usuário para execução exclusiva de @devops. Conforme o ciclo de vida, a story foi transicionada de
  InProgress para Done; Done aqui representa a implementação revisada pelo QA, não release em produção.
reviewer: "Quinn"
updated: "2026-08-27"
transition: "InProgress -> Done"

user_decisions:
  - "2026-08-26: o usuário recusou criar ambiente Supabase descartável nesta rodada por custo; essa recusa não é permanente."
  - "2026-08-27: produção deve permanecer somente leitura neste gate; nenhuma migration, DDL/DML, RPC de aplicação, cenário mutável, deploy, push, PR ou CodeRabbit foi autorizado."
  - "2026-08-27: a Edge Function não foi publicada; qualquer deploy depende de autorização explícita do usuário e deve ser levado pelo @devops."

preconditions:
  result: PASS
  verified_at: "2026-08-27"
  operation: >-
    Inspeção local e consultas read-only no Supabase. Nenhuma escrita de produção, migration, DDL/DML,
    RPC de aplicação, deploy, CodeRabbit, push ou PR foi executado pelo @qa.
  evidence:
    - >-
      list_migrations read-only registra 20260827020502_document_import_proposals_partial_unique_index e
      20260827020610_apply_boleto_payable_proposal_line_defense; Story 1.59/D18 está Done.
    - >-
      pg_indexes read-only confirma document_import_proposals_company_id_idempotency_key_key como UNIQUE
      em (company_id, idempotency_key), com predicado somente para status pending/applied.
    - >-
      execute_sql read-only confirma public.apply_boleto_payable_proposal(uuid) com prosecdef=false;
      o corpo lido exige sessão/empresa, deriva autoridade de idempotency_key, recalcula as duas eras e
      rejeita divergência de valor/vencimento com RAISE EXCEPTION.
    - >-
      O ambiente local não possui psql, Supabase CLI, Docker, pg, @electric-sql/pglite ou testcontainers;
      o banco de produção contém dados reais e não foi usado para cenários de teste.
  limitation: >-
    As pré-condições de D18 e D16 estão satisfeitas, mas a pré-condição operacional de publicação permanece
    aberta: document-extraction remoto está ACTIVE na versão 2 e não contém o caminho boleto desta story.

