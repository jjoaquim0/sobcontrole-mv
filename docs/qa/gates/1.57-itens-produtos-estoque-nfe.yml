    evidence: "Tabela, estados, filtro por união e decisões independentes permanecem; a correção D11 elimina current_cost do UPDATE e os testes provam ausência da chave no payload mesmo quando o patch a recebe."
    limitation: "Não houve clique contra uma sessão authenticated real; a prova é código, teste de payload e grants remotos."
