  evidence:
    - "O commit 1055210 contém exatamente os quatro caminhos esperados: a story e os três testes; migrations, rollbacks, Stories 1.55/1.56/1.57, .claude/launch.json e vite.config.ts ficaram fora dele."
    - "execute_sql somente-leitura em pg_indexes confirmou o índice UNIQUE composto com predicado status = ANY (ARRAY['pending', 'applied']) em public.document_import_proposals."
    - "list_migrations somente-leitura registra 20260827020502 document_import_proposals_partial_unique_index."
    - "package.json/package-lock.json/node_modules não possuem pg, @electric-sql/pglite ou testcontainers; psql, Supabase CLI e Docker não estão disponíveis localmente."
    - "O contrato da migration e do rollback passa; mutações em memória da mesma asserção produziram original PASS, remoção de applied FAIL, inclusão de rejected FAIL e quebra da chave composta FAIL."
  limitation: "O banco qxcchymwswontqcwqogm é produção com dados reais; o índice e o histórico foram apenas lidos, sem criação, alteração ou limpeza de cenários."

