    result: PASS
    evidence: "Os quatro campos do produto novo, bloqueio de prontidão, categoria inline, unidade e preço permanecem; o caminho Criar novo produto agora não envia current_cost e não cai no grant ausente."
    limitation: "Não houve chamada real da RPC para cadastrar produto em produção."
  AC5:
    result: CONCERNS
    evidence: "Implementação mantém categoria em lote somente após escolha, margem somente em preços vazios, autosave e reidratação por proposta pending."
    limitation: "A suíte não tem casos próprios para categoria em lote, margem, expiração/reload completo e corrida entre autosaves; são lacunas de cobertura, não regressão observada da correção D11."
  AC6:
