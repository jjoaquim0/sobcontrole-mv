acceptance_criteria:
  AC1:
    result: PASS
    evidence: "extractNfeHeader extrai det/prod em ordem, mapeia qCom/vUnCom/cEAN/xProd/uCom, mantém field_origins deterministic e preserva o cabeçalho; os testes cobrem zero, um, múltiplos itens, namespaces, barcode ausente/SEM GTIN e rejeições estruturais."
    limitation: "Não houve chamada real à Edge Function com um XML de produção; a prova disponível é parser/fixture e conteúdo remoto inspecionado."
  AC2:
    result: PASS
    evidence: "O handler autentica antes de resolver documento e persistir, deriva company_id do documento autorizado, aceita apenas document_version_id no corpo e persiste itens sob a mesma proposta. Testes cobrem ordem de autorização, tenant, itens, erro seguro e zero IA/quota; RLS remoto de itens exige company_id do usuário."
    limitation: "Não foi executada requisição de extração em produção; a comprovação é estática, por contrato e pelos testes com doubles."
  AC3:
    result: FAIL
    evidence: "A tabela implementa semântica, filtro por união, estados e duas decisões; os testes cobrem novo produto pendente, custo divergente e alertas. Porém onSelectProduct e onCreateNew enviam currentCost e saveNfeProposalItem o transforma em current_cost."
    limitation: "A leitura remota de column_privileges mostrou UPDATE somente em matched_product_id, payload e update_cost_decision, não em current_cost. Em uma sessão authenticated, a seleção/criação não consegue salvar a decisão completa; nenhuma escrita foi usada para reproduzir o erro na produção."
  AC4:
    result: CONCERNS
    evidence: "A UI apresenta nome, unidade, categoria, categoria inline e preço; isNfeProposalItemReady bloqueia o botão enquanto os quatro dados não estão válidos e a RPC exige as quatro chaves."
    limitation: "O caminho padrão sem sugestão pode editar payload, mas a ação explícita Criar novo produto envia current_cost e cai no mesmo grant ausente do AC3; não foi possível clicar contra produção."
  AC5:
    result: CONCERNS
    evidence: "Há extensão de categoria, margem aplicada apenas a preços vazios, autosave por payload e reidratação de proposta pendente."
    limitation: "Não há cobertura completa de categoria em lote, margem, reload/expiração e condições de corrida entre autosaves; além disso, a decisão de alternar produto sofre o bloqueio de current_cost."
  AC6:
    result: CONCERNS
    evidence: "Abaixo de 60 a tabela é renderizada; acima de 60 a UI preserva cabeçalho e exibe apenas VOLUME_NOTICE; acima de 20 itens pendentes aparece aviso não bloqueante; o texto antigo CUTOFF_NOTICE não aparece no app."
    limitation: "Os testes executam 21 e 61, mas não os quatro lados explícitos 20/21 e 60/61 em casos separados; não houve prova E2E do cabeçalho acima do corte."
  AC7:
    result: CONCERNS
    evidence: "O cliente faz preflight tenant/status, salva a proposta e chama somente apply_nfe_purchase_proposal; proposta aplicada não chama a RPC novamente. A RPC remota é invoker, bloqueia a proposta com FOR UPDATE e só marca applied ao final."
    limitation: "Sem escrita em produção, não foi possível observar uma única aplicação real, duplo clique/retry concorrente, falha em item posterior, rollback nem contagens sem estado parcial. A validação do item também é afetada pelo grant de current_cost e o vínculo de matched_product_id não tem verificação explícita de company_id na RPC."
  AC8:
    result: CONCERNS
    evidence: "A pré-condição deixou de estar bloqueada e foi verificada em 2026-08-25: @data-engineer reconciliou o histórico e aplicou 20260825140000; a RPC remota contém v_item_quantity e exatamente um UPDATE current_quantity = current_quantity + v_item_quantity fora do ELSIF de custo, para produto existente ou novo."
    limitation: "A produção não pode receber proposta de teste. Portanto não foram observados incremento positivo, exatamente uma atualização por item, concorrência, rollback após falha posterior ou produto novo terminando na quantidade da nota; o resultado não é reportado como PASS."
  AC9:
    result: CONCERNS
    evidence: "O commit não altera a Story 1.56; ela permanece Done. A função D10 remota tem a asserção positiva de incremento e a UI não possui caminho client-side paralelo de domínio/estoque."
    limitation: "Sem aplicação autorizada de uma proposta real, não há snapshot antes/depois que prove a superação positiva do antigo AC9 em products, purchase_items e current_quantity."
  AC10:
    result: CONCERNS
    evidence: "Há estado vazio aditivo, semântica table/caption, labels, foco inicial no heading, Escape, aria-live, role=alert, estados textuais e classes dark:."
    limitation: "A validação foi estática e por testes estruturais; não houve teste automatizado de teclado/foco, contraste ou renderização real em claro/escuro."
  AC11:
    result: PASS
    evidence: "Os quatro comandos globais foram executados separadamente no baseline e novamente após a emissão deste gate; lint focado e suíte focada passaram. A comparação mantém lint/typecheck globais sem piora, testes 66/586 e build 3005 módulos."
    limitation: "O Debug Log do @dev registra typecheck com exit 1, enquanto a reprodução de @qa observa exit 2; os 24 diagnósticos são os mesmos e não há EPERM."

top_issues:
  - id: "DATA-001"
    severity: high
    finding: "document_import_proposal_items concede UPDATE a payload, matched_product_id e update_cost_decision, mas não a current_cost. O fluxo de onSelectProduct/onCreateNew envia current_cost e o autosave falha em decisões essenciais de item."
    suggested_action: "@data-engineer deve corrigir o grant/migration de coluna de forma mínima e revisar RLS; depois @qa deve repetir a suíte e validar em ambiente descartável antes de liberar Done."
  - id: "TEST-001"
    severity: medium
    finding: "AC7-AC9 não têm evidência de integração positiva em atomicidade, idempotência concorrente, rollback, incremento para produto existente/novo ou contagens pós-aplicação."
    suggested_action: "Executar esses cenários apenas em branch/ambiente descartável Supabase autorizado, preservando a produção sem DML."
  - id: "SEC-001"
    severity: medium
    finding: "A RPC aceita matched_product_id vindo do item e verifica company_id no UPDATE de products, mas não valida explicitamente que o produto referenciado pertence à empresa antes de inserir purchase_items."
    suggested_action: "Adicionar validação server-side de pertencimento do produto à empresa ou uma restrição equivalente; cobrir tentativa cross-tenant em teste autorizado."
  - id: "REL-001"
    severity: medium
    finding: "A Edge Function grava proposta e itens em chamadas separadas e tenta compensar apagando a proposta se a inserção dos itens falhar; se o delete falhar, pode sobrar proposta pending sem itens."
    suggested_action: "Avaliar persistência transacional via RPC/rotina server-side ou mecanismo durável de compensação antes de depender do fluxo em volume."
  - id: "TEST-002"
    severity: low
    finding: "Os testes de volume cobrem 21 e 61, mas não exercitam explicitamente os limites 20 e 60 nem todas as rejeições/estados previstos."
    suggested_action: "Adicionar casos de fronteira 20/21 e 60/61 e matrizes de estados ao conjunto de regressão."
  - id: "DOC-001"
    severity: low
    finding: "O Debug Log do @dev registra npm run typecheck com exit 1; a execução reproduzível de @qa retorna exit 2."
    suggested_action: "Corrigir o código registrado na próxima manutenção documental; os 24 diagnósticos não pioraram."

